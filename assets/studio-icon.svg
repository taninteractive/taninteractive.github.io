<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sunny Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#FFEED1" />
      <stop offset="100%" stop-color="#FEDDA7" />
    </linearGradient>

    <!-- Warm Amber Orange for T -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA845" />
      <stop offset="100%" stop-color="#F27324" />
    </linearGradient>

    <!-- Playful Turquoise for I -->
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48DFEE" />
      <stop offset="100%" stop-color="#1EADC2" />
    </linearGradient>

    <!-- Sprout Green Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67B838" />
      <stop offset="100%" stop-color="#8CE042" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#804818" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#iconBgGrad)" stroke="#F39C38" stroke-width="12" />

  <!-- Inner Soft Golden Rim -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />

  <!-- Group with Soft Shadow -->
  <g filter="url(#softShadow)" transform="translate(256, 264)">
    <!-- Sprout on Letter T -->
    <g transform="translate(-86, -112)">
      <path d="M 0,0 C -22,-10 -28,-36 -4,-42 C 16,-48 18,-18 0,0 Z" fill="url(#sproutGrad)" stroke="#2A2340" stroke-width="5" />
      <path d="M 2,-2 C 18,-20 40,-20 36,4 C 30,22 10,12 2,-2 Z" fill="url(#sproutGrad)" stroke="#2A2340" stroke-width="5" />
      <circle cx="2" cy="0" r="4" fill="#2A2340" />
    </g>

    <!-- Letter T (Friendly, Chubby Rounded Letterform) -->
    <path d="M -150,-85 C -150,-102 -136,-115 -118,-115 L -26,-115 C -8,-115 6,-102 6,-85 C 6,-68 -8,-55 -26,-55 L -62,-55 L -56,65 C -56,86 -72,102 -92,102 C -112,102 -128,86 -128,65 L -122,-55 L -118,-55 C -136,-55 -150,-68 -150,-85 Z" 
          fill="url(#tGrad)" stroke="#2A2340" stroke-width="9" stroke-linejoin="round" />

    <!-- T Highlight Reflection -->
    <path d="M -132,-96 C -132,-104 -124,-108 -115,-108 L -30,-108" stroke="#FFE4AF" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Letter I (Joyful Mascot Form with Controller/Head) -->
    <!-- Mascot Head -->
    <circle cx="95" cy="-85" r="42" fill="url(#iGrad)" stroke="#2A2340" stroke-width="9" />
    <!-- Smiling Face on Head -->
    <circle cx="82" cy="-90" r="4.5" fill="#2A2340" />
    <circle cx="108" cy="-90" r="4.5" fill="#2A2340" />
    <path d="M 85,-75 Q 95,-64 105,-75" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Mascot Body (Stem of I) -->
    <path d="M 64,-30 C 50,-30 40,-18 42,0 L 52,65 C 54,86 70,102 92,102 C 114,102 130,86 132,65 L 142,0 C 144,-18 134,-30 120,-30 Z" 
          fill="url(#iGrad)" stroke="#2A2340" stroke-width="9" stroke-linejoin="round" />

    <!-- I Highlight Reflection -->
    <path d="M 72,-8 C 70,15 72,55 76,70" stroke="#B8F7FF" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Playful Sparkles -->
    <polygon points="152,-110 157,-122 169,-127 157,-132 152,-144 147,-132 135,-127 147,-122" fill="#FDBA34" stroke="#2A2340" stroke-width="3" />
    <polygon points="-145,20 -142,10 -132,6 -142,2 -145,-8 -148,2 -158,6 -148,10" fill="#FDBA34" stroke="#2A2340" stroke-width="2.5" />
  </g>
</svg>
